[theme]
base = "dark"
primaryColor = "#0ea5e9"
backgroundColor = "#070d18"
secondaryBackgroundColor = "#0d1e38"
textColor = "#f8fafc"
font = "sans serif"

[server]
headless = true
enableCORS = false
enableXsrfProtection = false
maxUploadSize = 500

[runner]
fastReruns = true

[browser]
gatherUsageStats = false

[client]
showErrorDetails = true

