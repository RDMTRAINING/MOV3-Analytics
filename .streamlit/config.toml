[theme]
primaryColor = "#0066B2"
backgroundColor = "#F8FAFC"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#0F172A"
font = "sans serif"

[server]
headless = true
enableCORS = false
enableXsrfProtection = false
maxUploadSize = 500

[runner]
fastReruns = true

[browser]
gatherUsageStats = false

[client]
showErrorDetails = true

